version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - dupword
    - errorlint
    - forbidigo
    - godoclint
    - godot
    - misspell
    - modernize
    - nilerr
    - noctx
    - testableexamples
  settings:
    depguard:
      rules:
        noerrors:
          files:
            - $all
            - "!**/errors/*.go"
          deny:
            - pkg: errors
              desc: Do not use errors package. Use github.com/SigNoz/baseplate.go/errors instead.
    forbidigo:
      forbid:
        - pattern: fmt.Errorf
          msg: Do not use fmt.Errorf. Use github.com/SigNoz/baseplate.go/errors instead.
    godoclint:
      default: all
    godot:
      scope: all
      capital: true
    misspell:
      locale: US
    errcheck:
      check-type-assertions: true
      disable-default-exclusions: true
  exclusions:
    generated: lax
    paths:
      - vendor/
