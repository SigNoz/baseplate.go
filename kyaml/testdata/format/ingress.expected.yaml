apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kilo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  rules:
  - host: kilo.example.com
    http:
      paths:
      - backend:
          service:
            name: kilo
            port:
              number: 8080
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - kilo.example.com
    secretName: kilo-tls
