kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  name: kilo
spec:
  tls:
  - secretName: kilo-tls
    hosts:
    - kilo.example.com
  rules:
  - http:
      paths:
      - backend:
          service:
            port:
              number: 8080
            name: kilo
        pathType: Prefix
        path: /
    host: kilo.example.com
  ingressClassName: nginx
